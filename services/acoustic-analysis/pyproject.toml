[project]
name = "heartbeat-acoustic-analysis"
version = "0.1.0"
description = "Self-hosted, experimental caller speech emotion analysis"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.123.9",
  "uvicorn==0.38.0",
  "python-multipart==0.0.20",
  "numpy==2.2.6",
  "scipy==1.16.3",
  "soundfile==0.13.1",
  "torch==2.9.1",
  "transformers==4.57.3",
  "webrtcvad-wheels==2.0.14",
]

[dependency-groups]
dev = ["pytest==9.0.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
